# Configuración de SonarCloud para GovSync [DEV-06].
#
# sonar.projectKey y sonar.organization vienen del proyecto creado en
# https://sonarcloud.io (Analyze new project -> importar este repositorio).
sonar.projectKey=CrisCamUO_govsyncFork
sonar.organization=criscamuo

sonar.projectName=GovSync

# Monorepo: backend Python + frontend React. SonarCloud detecta el lenguaje
# por extensión, no hace falta declararlo aparte.
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests
sonar.exclusions=**/node_modules/**,**/alembic/versions/**,**/.venv/**,**/dist/**,**/*.test.jsx,**/*.test.js

# Reusa el coverage.xml que `pytest` ya genera por `pyproject.toml`
# (`addopts = "--cov=app --cov-report=xml"`) — no se corre un paso aparte.
sonar.python.coverage.reportPaths=backend/coverage.xml

# El frontend todavía no tiene suite de pruebas (`npm test` es un no-op sin
# runner configurado, ver package.json) — sin esto no hay lcov que apuntar.
# Cuando exista, agregar: sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
