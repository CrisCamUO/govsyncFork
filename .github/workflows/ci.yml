name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run build

  backend-calidad:
    name: Backend — lint, formato y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --only-binary ":all:" -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # La cobertura mínima del DoD (70 %) se exige aquí, no en pyproject.toml,
      # para no bloquear la ejecución local durante el desarrollo.
      - run: python -m pytest --cov-fail-under=70

  backend-migraciones:
    name: Backend — migraciones contra PostgreSQL 16
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: govsync
          POSTGRES_PASSWORD: govsync
          POSTGRES_DB: govsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govsync -d govsync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      SECRET_KEY: clave-solo-para-ci-no-usar-en-produccion
      DATABASE_URL: postgresql+psycopg://govsync:govsync@localhost:5432/govsync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install --only-binary ":all:" -r requirements.txt
      # Ida y vuelta completa: valida upgrade, downgrade (incluye el drop
      # manual de los tipos ENUM) y un segundo upgrade sin colisiones.
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head

  migrate-render:
    name: Backend — aplica migraciones en Render
    runs-on: ubuntu-latest
    needs: [backend-calidad, backend-migraciones]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install --only-binary ":all:" -r requirements.txt
      # Solo upgrade -- nunca downgrade contra Render (backend-migraciones,
      # arriba, sí hace upgrade->downgrade->upgrade, pero contra una base
      # de Postgres desechable de CI, no contra datos reales). Ver
      # docs/DESPLIEGUE.md §4: este job NO hace respaldo antes de migrar.
      - run: alembic upgrade head

  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: git log -1 --pretty=%B | npx commitlint --config commitlint.config.cjs

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
